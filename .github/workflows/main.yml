name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: 生成完整工程并合并业务代码
        run: |
          # 生成标准 Flutter Android 工程脚手架
          flutter create --org com.example --project-name auto_ledger /tmp/temp_project
          
          # 备份我们的业务代码
          cp -r lib /tmp/business_lib
          cp -r android/app /tmp/business_android_app
          cp pubspec.yaml /tmp/business_pubspec.yaml
          cp analysis_options.yaml /tmp/business_analysis_options.yaml
          
          # 用完整工程替换当前目录
          rm -rf ./*
          cp -r /tmp/temp_project/* ./
          
          # 覆盖业务代码
          rm -rf lib
          cp -r /tmp/business_lib lib
          
          rm -rf android/app
          cp -r /tmp/business_android_app android/app
          
          cp -f /tmp/business_pubspec.yaml pubspec.yaml
          cp -f /tmp/business_analysis_options.yaml analysis_options.yaml

      - name: 安装项目依赖
        run: flutter pub get

      - name: 构建 Release 版 APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: auto-ledger-apk
          path: build/app/outputs/flutter-apk/*.apk
