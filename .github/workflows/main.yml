name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 生成完整原生工程并合并业务代码
        run: |
          # 生成标准完整的 Flutter Android 工程脚手架
          flutter create --org com.example --project-name auto_ledger --platforms=android /tmp/full_project
          
          # 用我们的业务代码覆盖默认工程
          cp -rf lib/* /tmp/full_project/lib/
          cp -rf android/app/* /tmp/full_project/android/app/
          cp -f pubspec.yaml /tmp/full_project/
          cp -f analysis_options.yaml /tmp/full_project/
          
          # 覆盖 iOS 代码（不影响 Android 构建，可选保留）
          cp -rf ios/Runner/* /tmp/full_project/ios/Runner/ 2>/dev/null || true
          
          # 把完整工程移回工作目录
          rm -rf ./*
          cp -rf /tmp/full_project/* ./

      - name: 添加 ML Kit 中文 OCR 依赖
        run: |
          # 直接追加依赖，避免之前 sed 匹配失败的问题
          sed -i '/^dependencies {/a\    implementation '\''com.google.mlkit:text-recognition-chinese:16.0.0'\''' android/app/build.gradle

      - name: 拉取项目依赖
        run: flutter pub get

      - name: 构建 Release 版 APK（按 CPU 架构分包）
        run: flutter build apk --release --split-per-abi

      - name: 打包上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: auto-ledger-apk
          path: build/app/outputs/flutter-apk/*.apk
