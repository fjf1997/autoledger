name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 锁定版本：避免 Flutter 模板格式变动导致构建脚本不匹配
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter 版本
        run: flutter --version

      # 关键：整个 android 目录用官方模板重新生成，
      # 彻底避免仓库里上传的旧脚本与云端 Flutter 版本不匹配
      - name: 重建 Android 原生工程
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # 备份我们定制的原生源码
          mkdir -p /tmp/keep
          if [ -d android/app/src ]; then cp -r android/app/src /tmp/keep/; fi
          rm -rf android
          cd /tmp && rm -rf scaffold
          flutter create --org com.example --project-name auto_ledger --platforms=android scaffold
          cp -r /tmp/scaffold/android "$GITHUB_WORKSPACE/android"
          # 恢复定制源码（MainActivity.kt / 通知服务 / Manifest）
          if [ -d /tmp/keep/src ]; then
            rm -rf "$GITHUB_WORKSPACE/android/app/src"
            cp -r /tmp/keep/src "$GITHUB_WORKSPACE/android/app/src"
          fi
          echo "--- 恢复后的原生源码 ---"
          find "$GITHUB_WORKSPACE/android/app/src" -type f | head -20

      # 注入端侧 OCR 依赖与最低系统版本
      - name: 注入 ML Kit 依赖
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          GRADLE_FILE=""
          if [ -f android/app/build.gradle.kts ]; then GRADLE_FILE=android/app/build.gradle.kts; fi
          if [ -f android/app/build.gradle ]; then GRADLE_FILE=android/app/build.gradle; fi
          echo "目标脚本: $GRADLE_FILE"
          if [ -z "$GRADLE_FILE" ]; then echo "找不到构建脚本"; exit 1; fi
          # 在 dependencies 块内追加 ML Kit
          sed -i 's|^dependencies {|dependencies {\n    implementation("com.google.mlkit:text-recognition-chinese:16.0.0")|' "$GRADLE_FILE"
          echo "--- 校验 ---"
          grep -n "mlkit" "$GRADLE_FILE"

      - name: flutter pub get
        run: flutter pub get

      - name: 构建 APK（分架构，体积小）
        run: flutter build apk --release --split-per-abi

      - name: 构建通用 APK
        run: flutter build apk --release

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ledger-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
