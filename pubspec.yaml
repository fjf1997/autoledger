name: auto_ledger
description: 自动记账 App —— 支持截图/通知识别账单，自动解析金额、商家与分类
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # 本地存储
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # 选图 / 权限
  image_picker: ^1.1.2

  # OCR（可选，远端多模态大模型）
  http: ^1.2.2

  # 图表 / 状态管理 / 格式化
  fl_chart: ^0.68.0
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
